name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-build:
    name: Backend build and test (.NET 10)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore backend/VocabLearning/VocabLearning.csproj

      - name: Build
        run: dotnet build backend/VocabLearning/VocabLearning.csproj --configuration Release --no-restore

      - name: Test
        env:
          VOCABLEARNING_TEST_POSTGRES_CONNECTION_STRING: 'Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=ci-only'
        run: dotnet test backend/VocabLearning.Tests/VocabLearning.Tests.csproj --configuration Release

  frontend-test:
    name: Frontend Playwright (mocked backend)
    # shortcut: Playwright 1.60 has no Chromium build for ubuntu-26.04 (ubuntu-latest); upgrade Playwright, then return to ubuntu-latest.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --reporter=line
        env:
          CI: 'true'
